[package]
name = "bmqos-installer"
version = "0.1.0"
description = "BMQOS installer wizard"
edition = "2021"

[lib]
name = "bmqos_installer"
path = "src/lib.rs"

[[bin]]
name = "bmqos-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
