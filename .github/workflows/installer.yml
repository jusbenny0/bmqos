name: Installer

on:
  push:
    branches: ["main", "dev"]
    paths: ["desktop/installer/**", ".github/workflows/installer.yml", "scripts/setup.mjs"]
  pull_request:
    paths: ["desktop/installer/**", ".github/workflows/installer.yml", "scripts/setup.mjs"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-latest
            args: "--bundles dmg"
    defaults:
      run:
        working-directory: desktop/installer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: desktop/installer/target
          key: installer-${{ runner.os }}-${{ hashFiles('desktop/installer/Cargo.toml') }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Tests
        run: cargo test
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build (unsigned)
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bmqos-installer-${{ runner.os }}
          path: |
            desktop/installer/target/release/bundle/deb/*.deb
            desktop/installer/target/release/bundle/appimage/*.AppImage
            desktop/installer/target/release/bundle/nsis/*.exe
            desktop/installer/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
